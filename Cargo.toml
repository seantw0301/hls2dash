[package]
name = "hls2dash"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust HLS ingest to live MPEG-DASH (H.264 + AAC remux)"
license = "MIT"
readme = "README.md"
keywords = ["hls", "dash", "streaming", "live", "h264"]
categories = ["multimedia", "network-programming"]

# Standalone package: ignore any parent Cargo workspace.
[workspace]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transmux = "0.15"
url = "2"

[dev-dependencies]
tempfile = "3"
