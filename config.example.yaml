# Public example only — copy to config.yaml for local use.
# HARD RULE: never put real production HLS URLs in this file or any tracked path.
# See doc/layout.md
dash:
  listen: "0.0.0.0"
  port: 8080

cache:
  dir: "./cache"
  segment_duration_secs: 2
  window_segments: 90
  cleanup_interval_secs: 180

reconnect_secs: 3

pull:
  - url: "http://origin.example.com/live/stream/index.m3u8"
    channel: "demo"
    enable: true
