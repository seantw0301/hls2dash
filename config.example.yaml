# Egress mode: dash | mpegts (exactly one).
# dash   → http://host:port/live/<channel>/index.mpd
# mpegts → http://host:port/live/<channel>/mpegts
#   (direct HLS .ts stitch → continuous TS; no CMAF)
output_mode: dash

dash:
  listen: "0.0.0.0"
  port: 8080

cache:
  dir: "./cache"
  segment_duration_secs: 2
  window_segments: 90
  cleanup_interval_secs: 180

# Used when output_mode: mpegts (trans_server-aligned knobs).
mpegts:
  live_holdback_segments: 6
  min_buffer_segments: 3
  max_segment_lag: 10
  send_queue: 32
  poll_interval_secs: 2
  pace_egress: true
  egress_chunk_ms: 250
  ingest_poll_factor: 0.25

# Global: fail → wait N seconds → retry (all channels).
reconnect_secs: 3

# Frame-loss recovery and safe cache retention.
recovery:
  segment_fetch_retries: 2
  segment_fetch_retry_ms: 200
  skip_missing_segments: true
  ts_resync_packets: true
  dash_skip_to_keyframe: true
  retention_grace_segments: 2

pull:
  # url path (e.g. sh_012) ≠ playback channel name.
  - url: "http://origin.example.com/cc/sh_012/index.m3u8"
    channel: "cctv1"
    enable: true
